<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PvZ Launcher Prototype</title>
    <style>
        :root {
            --sky-day: linear-gradient(to bottom, #4facfe 0%, #00f2fe 100%);
            --sky-night: linear-gradient(to bottom, #1e3c72 0%, #2a5298 100%);
            --grass-light: #4caf50;
            --grass-dark: #388e3c;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            background: #000;
        }

        #launcher-container {
            width: 100vw;
            height: 100vh;
            position: relative;
            transition: background 2s ease;
        }

        /* Sky and Background */
        .sky {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 60%;
            z-index: 1;
            transition: opacity 2s ease;
        }

        .day-sky { background: var(--sky-day); }
        .night-sky { background: var(--sky-night); opacity: 0; }

        /* Lawn Grid */
        .lawn {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 60%;
            background: #2e7d32;
            z-index: 2;
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            grid-template-rows: repeat(5, 1fr);
            perspective: 1000px;
        }

        .tile {
            border: 1px solid rgba(255,255,255,0.1);
        }

        .tile:nth-child(even) { background: var(--grass-light); }
        .tile:nth-child(odd) { background: var(--grass-dark); }

        /* HUD */
        .hud {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            color: white;
            text-shadow: 2px 2px 4px #000;
        }

        .sun-counter {
            background: rgba(0,0,0,0.5);
            padding: 10px 20px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            border: 3px solid #ffd700;
        }

        .sun-icon {
            width: 40px;
            height: 40px;
            background: #ffeb3b;
            border-radius: 50%;
            margin-right: 10px;
            box-shadow: 0 0 15px #ffeb3b;
        }

        .time-info h1 { margin: 0; font-size: 3em; }
        .greeting { font-style: italic; color: #ccff00; font-weight: bold; }

        /* App Carousel */
        .carousel {
            position: absolute;
            bottom: 10%;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            z-index: 15;
            padding: 20px;
        }

        .seed-packet {
            width: 160px;
            height: 240px;
            background: #5d4037;
            border: 4px solid #3e2723;
            border-radius: 8px;
            position: relative;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 10px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        .seed-packet:focus, .seed-packet.active {
            transform: scale(1.2) translateY(-20px);
            border-color: #ffeb3b;
            box-shadow: 0 0 30px #ffeb3b;
            z-index: 20;
        }

        .app-icon {
            width: 80px;
            height: 80px;
            background: #fff;
            border-radius: 12px;
            margin-top: 20px;
        }

        .app-name {
            color: #fff;
            font-weight: bold;
            text-align: center;
            font-size: 1.2em;
        }

        .cost {
            background: #fff;
            color: #000;
            width: 100%;
            text-align: right;
            padding-right: 10px;
            font-weight: bold;
            border-radius: 0 0 4px 4px;
        }

        /* Night elements */
        .moon {
            position: absolute;
            top: 50px;
            right: 100px;
            width: 80px;
            height: 80px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 40px #fff;
            opacity: 0;
            transition: opacity 2s ease;
        }

        .night-mode .night-sky, .night-mode .moon { opacity: 1; }
        .night-mode .day-sky { opacity: 0; }
        .night-mode .tile:nth-child(even) { background: #1b5e20; }
        .night-mode .tile:nth-child(odd) { background: #003300; }

        /* Navigation indicator */
        .controls-hint {
            position: absolute;
            bottom: 10px;
            right: 10px;
            color: rgba(255,255,255,0.5);
            font-size: 0.8em;
        }
    </style>
</head>
<body>
    <div id="launcher-container">
        <div class="sky day-sky"></div>
        <div class="sky night-sky"></div>
        <div class="moon"></div>
        
        <div class="hud">
            <div class="left-hud">
                <div class="sun-counter">
                    <div class="sun-icon"></div>
                    <span id="soles-count">500</span>
                </div>
                <div class="time-info">
                    <h1 id="clock">12:00</h1>
                    <div id="date">Domingo, 15 de Noviembre</div>
                    <div class="greeting">BRAINS...</div>
                </div>
            </div>
            <div class="right-hud">
                <div style="font-size: 40px;">🧤 📖 ⚙️</div>
            </div>
        </div>

        <div class="lawn" id="lawn">
            <!-- Generated by JS -->
        </div>

        <div class="carousel" id="carousel">
            <div class="seed-packet" tabindex="0">
                <div class="app-icon" style="background: #ffd700;"></div>
                <div class="app-name">XuperTV</div>
                <div class="cost">50</div>
            </div>
            <div class="seed-packet" tabindex="0">
                <div class="app-icon" style="background: #f00;"></div>
                <div class="app-name">YouTube</div>
                <div class="cost">100</div>
            </div>
            <div class="seed-packet" tabindex="0">
                <div class="app-icon" style="background: #4caf50;"></div>
                <div class="app-name">Settings</div>
                <div class="cost">75</div>
            </div>
        </div>

        <div class="controls-hint">Usa las flechas para navegar, Enter para abrir</div>
    </div>

    <script>
        // Generate lawn
        const lawn = document.getElementById('lawn');
        for (let i = 0; i < 45; i++) {
            const tile = document.createElement('div');
            tile.className = 'tile';
            lawn.appendChild(tile);
        }

        // Clock update
        function updateClock() {
            const now = new Date();
            const h = now.getHours().toString().padStart(2, '0');
            const m = now.getMinutes().toString().padStart(2, '0');
            document.getElementById('clock').innerText = `${h}:${m}`;
            
            // Toggle day/night based on hour (simulated)
            const hour = now.getHours();
            if (hour >= 18 || hour < 6) {
                document.getElementById('launcher-container').classList.add('night-mode');
            } else {
                document.getElementById('launcher-container').classList.remove('night-mode');
            }
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Keyboard navigation simulation
        const packets = document.querySelectorAll('.seed-packet');
        let currentIndex = 0;
        packets[0].focus();

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') {
                currentIndex = (currentIndex + 1) % packets.length;
                packets[currentIndex].focus();
            } else if (e.key === 'ArrowLeft') {
                currentIndex = (currentIndex - 1 + packets.length) % packets.length;
                packets[currentIndex].focus();
            } else if (e.key === 'Enter') {
                alert('Abriendo ' + packets[currentIndex].querySelector('.app-name').innerText);
            }
        });
    </script>
</body>
</html>
